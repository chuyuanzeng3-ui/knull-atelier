<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knull's Little Atelier</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: 'Baloo 2', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  body {
    background-color: #FCF0CE;
    background-image: radial-gradient(circle, #B9D6EC 5px, transparent 5.5px);
    background-size: 96px 96px;
    color: #6B4226;
  }

  /* ---------- pages ---------- */
  .page {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden;
    transition: opacity .5s ease, visibility 0s linear .5s;
  }
  .page.active { opacity: 1; visibility: visible; transition: opacity .5s ease; }

  /* a frame keeps image + hotspots aligned and fits any screen */
  .frame {
    position: relative;
    width: min(100vw, calc(100vh * var(--ar)));
    aspect-ratio: var(--ar);
  }
  .frame > img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }

  .hot {
    position: absolute; border: none; background: transparent; cursor: pointer;
    border-radius: 14px; -webkit-tap-highlight-color: transparent;
    transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .hot:hover, .hot:focus-visible { background: rgba(255,255,255,.28); box-shadow: 0 0 0 3px rgba(240,184,96,.7); outline: none; }
  .hot:active { transform: scale(.97); }

  /* ---------- 01 envelope ---------- */
  #envelope .frame, #welcome .frame { --ar: 1170 / 614; }
  #envelope .frame { cursor: pointer; }
  .fade-img { transition: opacity .6s ease, transform .6s ease; }
  #envelope .open-img { opacity: 0; transform: scale(.96); }
  #envelope.opened .open-img { opacity: 1; transform: scale(1); }
  #envelope.opened .closed-img { opacity: 0; transform: scale(1.04); }
  .tap-hint {
    position: absolute; left: 0; right: 0; bottom: 3%; text-align: center;
    font-size: clamp(12px, 1.8vw, 16px); color: #B38A55; animation: blink 1.6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes blink { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
  #envelope.opened .tap-hint { display: none; }
  #envelope .start-hot { left: 38%; top: 80%; width: 24%; height: 14%; pointer-events: none; }
  #envelope.opened .start-hot { pointer-events: auto; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(240,184,96,.0); } 50% { box-shadow: 0 0 0 8px rgba(240,184,96,.45); } }

  /* ---------- 03 loading ---------- */
  #loading .frame { --ar: 1314 / 1197; }
  .bar {
    position: absolute; left: 30.82%; top: 67.33%; width: 39.35%; height: 6.43%;
    border: clamp(2px, .35vw, 4px) solid #9B6B3A; border-radius: 999px; overflow: hidden; background: #FCF0CE;
  }
  .bar-fill {
    height: 100%; width: 0%;
    background: repeating-linear-gradient(-45deg, #F7CF63, #F7CF63 9px, #F2C14E 9px, #F2C14E 18px);
    transition: width .12s linear;
  }
  .pct {
    position: absolute; left: 30.82%; top: 75.2%; width: 39.35%; text-align: right;
    font-size: clamp(11px, 1.5vw, 15px); color: #9B6B3A;
  }

  /* ---------- 04 home ---------- */
  #home .frame { --ar: 1536 / 1024; }
  .home-hint {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 1.2%;
    font-size: clamp(11px, 1.4vw, 14px); color: #B38A55; pointer-events: none;
  }

  /* ---------- module placeholder ---------- */
  .module { flex-direction: column; text-align: center; padding: 24px; gap: 14px; }
  .module .emoji { font-size: 0; }
  .module h1 { font-size: clamp(26px, 5vw, 38px); color: #6B4226; }
  .module h2 { font-size: clamp(14px, 2.4vw, 18px); color: #B38A55; font-weight: 500; }
  .module p { font-size: 15px; color: #9B6B3A; max-width: 320px; line-height: 1.8;
    background: #FFFAEB; border: 2px dashed #E3CC93; border-radius: 16px; padding: 14px 18px; }
  .back {
    position: fixed; top: 16px; left: 16px; z-index: 5;
    background: #FFFAEB; border: 2px solid #D9BE86; color: #6B4226; border-radius: 999px;
    padding: 8px 16px; font-family: inherit; font-size: 14px; cursor: pointer;
    box-shadow: 0 2px 0 rgba(155,107,58,.25);
  }
  .back:hover { background: #FFF3CC; }

  /* ---------- 扭蛋日记 ---------- */
  #gacha .frame { container-type: inline-size; }
  .g-count {
    position: absolute; left: 75.2%; top: 21.4%; width: 13.4%; height: 5.6%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 2.1cqw; line-height: 1.35; color: #8A5A2E; text-align: center; pointer-events: none;
  }
  .g-count b { font-size: 3.2cqw; font-weight: 600; color: #4F7FB0; }
  @keyframes gshake { 0%,100% { transform: translateX(0) } 20% { transform: translateX(-1.2cqw) rotate(-.6deg) } 40% { transform: translateX(1.2cqw) rotate(.6deg) } 60% { transform: translateX(-.9cqw) } 80% { transform: translateX(.9cqw) } }
  #gFrame.shake { animation: gshake .7s ease; }

  .cap {
    --c: #F4A7B9;
    position: absolute; left: 49.7%; top: 85.2%; width: 11.5%; aspect-ratio: 1;
    transform: translate(-50%, -50%); border-radius: 50%; cursor: pointer;
    background: linear-gradient(to bottom, var(--c) 50%, rgba(255,255,255,.88) 50%);
    border: .45cqw solid rgba(155,107,58,.55); box-shadow: 0 .6cqw 0 rgba(155,107,58,.25);
  }
  .cap::after { content: ""; position: absolute; left: 18%; top: 14%; width: 22%; height: 14%; border-radius: 50%; background: rgba(255,255,255,.75); transform: rotate(-30deg); }
  .cap.drop { animation: capdrop .8s cubic-bezier(.3,1.5,.5,1) both; }
  .cap.ready { animation: capwiggle 1.4s ease-in-out infinite; }
  @keyframes capdrop { from { opacity: 0; transform: translate(-50%, -190%) scale(.35); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  @keyframes capwiggle { 0%,100% { transform: translate(-50%, -50%) rotate(0); } 25% { transform: translate(-50%, -50%) rotate(-8deg); } 75% { transform: translate(-50%, -50%) rotate(8deg); } }
  .g-tip { position: absolute; left: 0; right: 0; top: 91.5%; text-align: center; font-size: 2.1cqw; color: #8A5A2E; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .g-tip.show { opacity: 1; }

  .coll-btn {
    position: fixed; right: 16px; bottom: 16px; z-index: 5; background: #FFFAEB; border: 2px solid #D9BE86;
    color: #6B4226; border-radius: 999px; padding: 8px 16px; font-family: inherit; font-size: 14px; cursor: pointer;
    box-shadow: 0 2px 0 rgba(155,107,58,.25); display: none;
  }
  #gacha.active .coll-btn { display: block; }

  .ov { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: rgba(107,66,38,.38); opacity: 0; visibility: hidden; transition: opacity .3s, visibility 0s linear .3s; padding: 16px; }
  .ov.show { opacity: 1; visibility: visible; transition: opacity .3s; }
  .x { position: absolute; top: 16px; right: 20px; width: 40px; height: 40px; border-radius: 50%; border: 2px solid #D9BE86;
    background: #FFFAEB; color: #6B4226; font-size: 24px; line-height: 1; cursor: pointer; font-family: inherit; }

  .paper {
    position: relative; background: #FFFAEB; border: 2px dashed #E3CC93; border-radius: 14px;
    width: min(420px, 92vw); max-height: 88vh; overflow-y: auto; padding: 30px 26px 22px; text-align: center;
    box-shadow: 0 6px 0 rgba(155,107,58,.2); transform: rotate(-1.2deg);
  }
  .tape { position: absolute; top: -14px; left: 50%; width: 90px; height: 26px; transform: translateX(-50%) rotate(-2deg);
    background: repeating-linear-gradient(45deg, #BFD8F0, #BFD8F0 6px, #D5E6F7 6px, #D5E6F7 12px); opacity: .9; }
  .p-emoji { font-size: 44px; line-height: 1.2; }
  .p-title { font-size: 19px; color: #6B4226; margin-bottom: 6px; }
  .p-text { font-size: 18px; line-height: 1.9; color: #6B4226; white-space: pre-line; margin: 8px 0 4px; }
  .p-date { font-size: 12px; color: #B38A55; margin-top: 8px; }
  .p-photos { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 8px 0; }
  .p-photos img { width: 30%; max-width: 110px; aspect-ratio: 1; object-fit: cover; border-radius: 8px; border: 3px solid #fff; box-shadow: 0 2px 4px rgba(107,66,38,.25); }
  .p-btns { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
  .btn { font-family: inherit; font-size: 15px; padding: 9px 20px; border-radius: 999px; border: 2px solid #D9A45A; background: #F8D58A; color: #6B4226; cursor: pointer; box-shadow: 0 2px 0 rgba(155,107,58,.25); }
  .btn.soft { background: #FFFAEB; border-color: #D9BE86; }
  .btn.soft.on { background: #FBD6DC; border-color: #E79BAA; }
  .btn.big { margin-top: 16px; width: 100%; background: #8FB8E8; border-color: #6F9AD0; color: #fff; }

  .reveal { position: relative; display: flex; align-items: center; justify-content: center; }
  .reveal .shell { --c: #F4A7B9; position: absolute; width: 130px; height: 130px; }
  .shell i { position: absolute; left: 0; width: 100%; height: 50%; border: 4px solid rgba(155,107,58,.55); transition: transform .7s ease, opacity .5s ease .25s; }
  .shell .top { top: 0; background: var(--c); border-radius: 65px 65px 0 0; }
  .shell .bot { bottom: 0; background: rgba(255,255,255,.9); border-radius: 0 0 65px 65px; }
  .reveal.open .shell .top { transform: translate(-30px, -70px) rotate(-28deg); opacity: 0; }
  .reveal.open .shell .bot { transform: translate(30px, 70px) rotate(24deg); opacity: 0; }
  .reveal .paper { opacity: 0; transform: scale(.6) rotate(-1.2deg); transition: opacity .5s ease .35s, transform .5s cubic-bezier(.3,1.4,.5,1) .35s; }
  .reveal.open .paper { opacity: 1; transform: scale(1) rotate(-1.2deg); }

  .put { text-align: left; }
  .put .p-title { text-align: center; margin-bottom: 10px; }
  .lab { display: block; font-size: 13px; color: #9B6B3A; margin: 12px 0 5px; }
  .put textarea { width: 100%; height: 76px; resize: none; border: 2px solid #E3CC93; border-radius: 10px; background: #FFFDF4; padding: 8px 10px; font-family: inherit; font-size: 15px; color: #6B4226; }
  .put textarea:focus { outline: none; border-color: #D9A45A; }
  .pick { justify-content: flex-start; }
  .pick .ph { position: relative; width: 64px; height: 64px; }
  .pick .ph img { width: 64px; height: 64px; max-width: none; }
  .pick .ph b { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: #E79BAA; color: #fff; font-size: 13px; line-height: 20px; text-align: center; cursor: pointer; }
  .pick .add { width: 64px; height: 64px; border: 2px dashed #D9BE86; border-radius: 8px; color: #D9BE86; font-size: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .moods { display: flex; gap: 10px; }
  .moods button { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #E3CC93; background: #FFFDF4; font-size: 24px; cursor: pointer; }
  .moods button.on { border-color: #6F9AD0; background: #E3EFFB; transform: scale(1.1); }

  .coll { text-align: left; width: min(460px, 92vw); }
  .coll .item { display: flex; gap: 10px; align-items: flex-start; border-top: 1px dashed #E3CC93; padding: 10px 0; font-size: 15px; color: #6B4226; line-height: 1.6; }
  .coll .item .e { font-size: 24px; }
  .coll .item .t { flex: 1; }
  .coll .item small { display: block; color: #B38A55; font-size: 12px; }
  .coll .item .del { border: none; background: none; color: #E79BAA; cursor: pointer; font-size: 13px; font-family: inherit; }
  .coll .empty { text-align: center; color: #B38A55; font-size: 14px; padding: 18px 0 4px; }
  .toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px); z-index: 30; background: #FFFAEB; border: 2px solid #D9BE86; color: #6B4226;
    padding: 8px 18px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- 竖屏提示 ---------- */
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 99;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background-color: #FCF0CE; background-image: radial-gradient(circle, #B9D6EC 5px, transparent 5.5px); background-size: 96px 96px;
    text-align: center; color: #6B4226; font-size: 18px; line-height: 1.8; padding: 24px;
  }
  #rotate .phone {
    width: 54px; height: 90px; border: 4px solid #9B6B3A; border-radius: 12px; background: #FFFAEB;
    animation: turn 2.4s ease-in-out infinite;
  }
  @keyframes turn { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  #rotate small { font-size: 13px; color: #B38A55; }
  @media (orientation: portrait) and (max-width: 820px) { #rotate { display: flex; } }
</style>
</head>
<body>

<div id="rotate">
  <div class="phone"></div>
  <div>请把手机横过来看 ♡<br><small>Please rotate your phone</small></div>
</div>

<!-- 01 信封页 -->
<section class="page" id="envelope" data-page="envelope">
  <div class="frame" id="envFrame">
    <img class="fade-img open-img" src="assets/envelope_open.jpg" alt="hi knull">
    <img class="fade-img closed-img" src="assets/envelope_closed.jpg" alt="For knull">
    <div class="tap-hint">点一下信封，打开它 ♡</div>
    <button class="hot start-hot" id="startBtn" aria-label="start"></button>
  </div>
</section>

<!-- 03 Loading 页 -->
<section class="page" id="loading" data-page="loading">
  <div class="frame">
    <img src="assets/loading_bg.jpg" alt="welcome to Knull's little world">
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="pct" id="pct">0%</div>
  </div>
</section>

<!-- 04 首页 -->
<section class="page" id="home" data-page="home">
  <div class="frame">
    <img src="assets/home.jpg" alt="Knull's Little Atelier">
    <!-- bottom cards -->
    <button class="hot" data-go="gallery"  aria-label="画室"       style="left:2.3%;  top:72.5%; width:22.4%; height:17.5%"></button>
    <button class="hot" data-go="doll"     aria-label="娃娃改造室" style="left:26.2%; top:72.5%; width:22.5%; height:17.5%"></button>
    <button class="hot" data-go="handmade" aria-label="手工桌"     style="left:50%;   top:72.5%; width:22.5%; height:17.5%"></button>
    <button class="hot" data-go="gacha"    aria-label="扭蛋日记"   style="left:73.7%; top:72.5%; width:22.5%; height:17.5%"></button>
    <!-- room objects -->
    <button class="hot" data-go="gallery"  aria-label="画架"       style="left:4.6%;  top:33%; width:15.6%; height:38%"></button>
    <button class="hot" data-go="handmade" aria-label="手工桌"     style="left:32.5%; top:43%; width:26.4%; height:29%"></button>
    <button class="hot" data-go="doll"     aria-label="娃娃衣柜"   style="left:60.2%; top:31%; width:17.9%; height:39%"></button>
    <button class="hot" data-go="gacha"    aria-label="扭蛋机"     style="left:79.7%; top:34%; width:15%;   height:37%"></button>
  </div>
</section>

<!-- module placeholders (to be built one by one) -->
<section class="page module" id="gallery"  data-page="gallery">
  <button class="back" data-go="home">&#8592; Back to Atelier</button>
  <h1>画室</h1><h2>Gallery</h2><p>记录我的画画作品。<br>这个房间正在布置中，马上就好。</p>
</section>
<section class="page module" id="doll" data-page="doll">
  <button class="back" data-go="home">&#8592; Back to Atelier</button>
  <h1>娃娃改造室</h1><h2>Doll Studio</h2><p>给娃娃换装、换发型。<br>这个房间正在布置中，马上就好。</p>
</section>
<section class="page module" id="handmade" data-page="handmade">
  <button class="back" data-go="home">&#8592; Back to Atelier</button>
  <h1>手工桌</h1><h2>Handmade Desk</h2><p>记录我的手工作品。<br>这个房间正在布置中，马上就好。</p>
</section>
<!-- 扭蛋日记 -->
<section class="page" id="gacha" data-page="gacha">
  <div class="frame" id="gFrame" style="--ar:1086 / 1448">
    <img src="assets/gacha_bg.jpg" alt="每日一记 Daily Capsule" id="gImg">
    <div class="g-count">今日已投放<br><b id="gCount">12</b> 颗扭蛋 &#9825;</div>
    <button class="hot" data-go="home" aria-label="Back to Atelier" style="left:3.2%; top:2.8%; width:21%; height:4.3%"></button>
    <button class="hot" id="gKnob" aria-label="转一转" style="left:41.9%; top:70.5%; width:16%; height:12%; border-radius:50%"></button>
    <button class="hot" id="gDraw" aria-label="抽一颗" style="left:4.6%; top:58.4%; width:19.8%; height:29.4%"></button>
    <button class="hot" id="gPut"  aria-label="放一颗" style="left:75.7%; top:58.4%; width:20.5%; height:29.4%"></button>
    <div class="cap" id="gCap" style="display:none"></div>
    <div class="g-tip" id="gTip">点一下扭蛋，打开看看</div>
  </div>
  <button class="coll-btn" id="collBtn">我的收藏 &#9825; <span id="collN">0</span></button>

  <!-- 打开扭蛋 -->
  <div class="ov" id="ovReveal">
    <div class="reveal" id="revealBox">
      <div class="shell"><i class="top"></i><i class="bot"></i></div>
      <div class="paper" id="paper">
        <div class="tape"></div>
        <div class="p-emoji" id="pEmoji"></div>
        <div class="p-title" id="pTitle"></div>
        <div class="p-text" id="pText"></div>
        <div class="p-photos" id="pPhotos"></div>
        <div class="p-date" id="pDate"></div>
        <div class="p-btns">
          <button class="btn soft" id="btnFav">收藏 &#9825;</button>
          <button class="btn" id="btnAgain">再抽一颗 &#9825;</button>
        </div>
      </div>
    </div>
    <button class="x" data-close="ovReveal" aria-label="close">&#215;</button>
  </div>

  <!-- 放一颗 -->
  <div class="ov" id="ovPut">
    <div class="paper put">
      <div class="tape"></div>
      <div class="p-title">放进今天的扭蛋吧 &#9825;</div>
      <label class="lab">写一句想记录的话…</label>
      <textarea id="putText" maxlength="80" placeholder="今天去买到了可爱的贴纸，心情超好！"></textarea>
      <label class="lab">加几张照片（1-3张，可不加）</label>
      <div class="p-photos pick" id="putPics">
        <label class="add" id="addPic">+<input type="file" accept="image/*" multiple id="putFile" hidden></label>
      </div>
      <label class="lab">今天的心情是？</label>
      <div class="moods" id="moods"></div>
      <button class="btn big" id="btnPutGo">Put it inside &#9825;</button>
    </div>
    <button class="x" data-close="ovPut" aria-label="close">&#215;</button>
  </div>

  <!-- 我的收藏 -->
  <div class="ov" id="ovColl">
    <div class="paper coll">
      <div class="tape"></div>
      <div class="p-title">我的收藏 &#9825;</div>
      <div id="collList"></div>
    </div>
    <button class="x" data-close="ovColl" aria-label="close">&#215;</button>
  </div>
  <div class="toast" id="toast"></div>
</section>

<script>
  var pages = document.querySelectorAll('.page');
  var loadTimer = null;

  function show(name) {
    if (!document.getElementById(name)) name = 'envelope';
    pages.forEach(function (p) { p.classList.toggle('active', p.id === name); });
    if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
    if (name === 'loading') runLoading();
  }

  /* 信封：点开 -> 点 start */
  var env = document.getElementById('envelope');
  document.getElementById('envFrame').addEventListener('click', function () {
    if (!env.classList.contains('opened')) env.classList.add('opened');
  });
  document.getElementById('startBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    show('loading');
  });

  /* Loading 进度条 */
  function runLoading() {
    var fill = document.getElementById('barFill'), pct = document.getElementById('pct');
    var v = 0; clearTimeout(loadTimer);
    fill.style.width = '0%'; pct.textContent = '0%';
    (function step() {
      v += v < 70 ? 2 + Math.random() * 4 : 0.8 + Math.random() * 2;
      if (v >= 100) {
        v = 100; fill.style.width = '100%'; pct.textContent = '100%';
        loadTimer = setTimeout(function () { show('home'); }, 600);
        return;
      }
      fill.style.width = v + '%'; pct.textContent = Math.floor(v) + '%';
      loadTimer = setTimeout(step, 110);
    })();
  }

  /* 通用跳转：任何带 data-go 的按钮 */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go]');
    if (t) show(t.getAttribute('data-go'));
  });

  /* =========================================================
     扭蛋日记
     数据层：预设内容在下面的 PRESETS；她自己「放一颗」的内容存在
     浏览器的 IndexedDB 里。以后接后台，只需要改 store 这一块。
     ========================================================= */
  var PRESETS = [
    { id: 'p1',  emoji: '🐻', text: '今天也没有什么大事，先吃饭吧。' },
    { id: 'p2',  emoji: '🍮', text: '烦恼先放一下，布丁不能放太久。' },
    { id: 'p3',  emoji: '🛌', text: '本来只想躺五分钟，怎么天黑了？' },
    { id: 'p4',  emoji: '🍞', text: '肚子饿的时候，不适合思考人生。' },
    { id: 'p5',  emoji: '🐥', text: '今日计划：随便弄弄。' },
    { id: 'p6',  emoji: '🧸', text: '今天不想营业，本熊暂时离线。' },
    { id: 'p7',  emoji: '🍰', text: '今天也要记得吃一点喜欢的东西。' },
    { id: 'p8',  emoji: '☁️', text: '今天的脑袋：加载失败。' },
    { id: 'p9',  emoji: '✂️', text: '这个剪歪了？不，这是设计。' },
    { id: 'p10', emoji: '🎨', text: '画错了吗？没有，这是新画风。' },
    { id: 'p11', emoji: '🍀', title: '欢迎扭蛋 WELCOME',
      text: '如果你抽到了这一颗，这是我提前准备好的欢迎。\n\n这个网站以后会慢慢装进你的画、你的手工，还有很多普通有趣的日子。\n\n希望很久以后再打开这里，你还是会喜欢。' },
    { id: 'p12', emoji: '💌', title: 'For 婧 ♡',
      text: '婧对我来说是很特别的存在。\n\n光是想到你，和你讲话，就会觉得很幸福。\n\n希望婧一切顺利，平安健康，像轻松熊一样轻松。' }
  ];
  var COLORS = ['#F4A7B9', '#F7CF63', '#A9D58B', '#8FB8E8', '#B9A0DE'];
  var MOODS = ['😊', '😌', '😴', '😮‍💨', '🥰'];

  var store = (function () {
    var dbp = new Promise(function (res, rej) {
      var r = indexedDB.open('knull_atelier', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('caps', { keyPath: 'id' }); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
    function tx(mode, fn) {
      return dbp.then(function (db) {
        return new Promise(function (res, rej) {
          var req = fn(db.transaction('caps', mode).objectStore('caps'));
          req.onsuccess = function () { res(req.result); };
          req.onerror = function () { rej(req.error); };
        });
      });
    }
    return {
      all: function () { return tx('readonly', function (s) { return s.getAll(); }); },
      put: function (v) { return tx('readwrite', function (s) { return s.put(v); }); },
      del: function (id) { return tx('readwrite', function (s) { return s.delete(id); }); }
    };
  })();

  var G = { mine: [], favs: JSON.parse(localStorage.getItem('knull_favs') || '[]'), cur: null, busy: false, pics: [], mood: null };
  var $ = function (id) { return document.getElementById(id); };

  function pool() { return PRESETS.concat(G.mine); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function toast(t) { var e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(e._t); e._t = setTimeout(function () { e.classList.remove('show'); }, 1800); }
  function refresh() { $('gCount').textContent = pool().length; $('collN').textContent = G.favs.length; }
  function openOv(id) { $(id).classList.add('show'); }
  function closeOv(id) { $(id).classList.remove('show'); }

  store.all().then(function (list) { G.mine = list.sort(function (a, b) { return a.id < b.id ? -1 : 1; }); refresh(); }).catch(function () { refresh(); });
  refresh();

  document.querySelectorAll('[data-close]').forEach(function (b) {
    b.addEventListener('click', function () { closeOv(b.getAttribute('data-close')); });
  });
  document.querySelectorAll('.ov').forEach(function (o) {
    o.addEventListener('click', function (e) { if (e.target === o) closeOv(o.id); });
  });

  /* ----- 抽一颗 ----- */
  function drawOne() {
    if (G.busy) return; G.busy = true;
    var cap = $('gCap'), tip = $('gTip'), fr = $('gFrame');
    cap.style.display = 'none'; cap.className = 'cap'; tip.classList.remove('show');
    fr.classList.remove('shake'); void fr.offsetWidth; fr.classList.add('shake');
    var all = pool(), pick;
    if (!localStorage.getItem('knull_drawn')) { pick = PRESETS[10]; localStorage.setItem('knull_drawn', '1'); }   // 第一次一定是欢迎扭蛋
    else pick = all[Math.floor(Math.random() * all.length)];
    G.cur = pick;
    setTimeout(function () {
      var c = pick.color || COLORS[Math.floor(Math.random() * COLORS.length)];
      cap.style.setProperty('--c', c); cap.style.display = 'block'; cap.classList.add('drop');
      setTimeout(function () { cap.classList.remove('drop'); cap.classList.add('ready'); tip.classList.add('show'); G.busy = false; }, 850);
    }, 650);
  }
  $('gKnob').addEventListener('click', drawOne);
  $('gDraw').addEventListener('click', drawOne);

  /* ----- 打开扭蛋 ----- */
  $('gCap').addEventListener('click', function () {
    if (!G.cur || G.busy) return;
    var c = G.cur, cap = $('gCap');
    $('revealBox').classList.remove('open');
    document.querySelector('#revealBox .shell').style.setProperty('--c', cap.style.getPropertyValue('--c') || COLORS[0]);
    $('pEmoji').textContent = c.emoji || (c.mood || '🍀');
    $('pTitle').textContent = c.title || '';
    $('pTitle').style.display = c.title ? 'block' : 'none';
    $('pText').textContent = c.text;
    $('pPhotos').innerHTML = (c.photos || []).map(function (p) { return '<img src="' + p + '" alt="">'; }).join('');
    $('pDate').textContent = c.date ? '— ' + c.date : '';
    setFavBtn();
    openOv('ovReveal');
    setTimeout(function () { $('revealBox').classList.add('open'); }, 500);
    cap.style.display = 'none'; $('gTip').classList.remove('show');
  });
  function setFavBtn() {
    var on = G.favs.indexOf(G.cur.id) >= 0, b = $('btnFav');
    b.classList.toggle('on', on); b.innerHTML = on ? '已收藏 &#9829;' : '收藏 &#9825;';
  }
  $('btnFav').addEventListener('click', function () {
    var i = G.favs.indexOf(G.cur.id);
    if (i >= 0) G.favs.splice(i, 1); else G.favs.push(G.cur.id);
    localStorage.setItem('knull_favs', JSON.stringify(G.favs)); setFavBtn(); refresh();
  });
  $('btnAgain').addEventListener('click', function () { closeOv('ovReveal'); setTimeout(drawOne, 350); });

  /* ----- 放一颗 ----- */
  $('moods').innerHTML = MOODS.map(function (m) { return '<button type="button" data-m="' + m + '">' + m + '</button>'; }).join('');
  $('moods').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    G.mood = G.mood === b.dataset.m ? null : b.dataset.m;
    this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x.dataset.m === G.mood); });
  });
  function drawPics() {
    var box = $('putPics'), add = $('addPic');
    box.querySelectorAll('.ph').forEach(function (n) { n.remove(); });
    G.pics.forEach(function (p, i) {
      var d = document.createElement('div'); d.className = 'ph';
      d.innerHTML = '<img src="' + p + '"><b data-i="' + i + '">&#215;</b>';
      box.insertBefore(d, add);
    });
    add.style.display = G.pics.length >= 3 ? 'none' : 'flex';
  }
  $('putPics').addEventListener('click', function (e) {
    var b = e.target.closest('b[data-i]'); if (b) { G.pics.splice(+b.dataset.i, 1); drawPics(); }
  });
  function shrink(file) {
    return new Promise(function (res) {
      var fr = new FileReader();
      fr.onload = function () {
        var im = new Image();
        im.onload = function () {
          var s = Math.min(1, 720 / Math.max(im.width, im.height)), cv = document.createElement('canvas');
          cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
          cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
          res(cv.toDataURL('image/jpeg', 0.78));
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  $('putFile').addEventListener('change', function () {
    var files = Array.prototype.slice.call(this.files, 0, 3 - G.pics.length), self = this;
    Promise.all(files.map(shrink)).then(function (arr) { G.pics = G.pics.concat(arr); drawPics(); self.value = ''; });
  });
  $('gPut').addEventListener('click', function () {
    $('putText').value = ''; G.pics = []; G.mood = null; drawPics();
    document.querySelectorAll('#moods button').forEach(function (x) { x.classList.remove('on'); });
    openOv('ovPut');
  });
  $('btnPutGo').addEventListener('click', function () {
    var text = $('putText').value.trim();
    if (!text && !G.pics.length) { toast('写一句话或加一张照片吧'); return; }
    var d = new Date();
    var entry = {
      id: 'u' + Date.now(), text: text || '（只放了照片）', photos: G.pics.slice(), mood: G.mood,
      emoji: G.mood || '📝', color: COLORS[Math.floor(Math.random() * COLORS.length)],
      date: d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate()
    };
    store.put(entry).then(function () {
      G.mine.push(entry); refresh(); closeOv('ovPut'); toast('已放进扭蛋机 ♡');
    }).catch(function () { toast('保存失败了，换个浏览器试试'); });
  });

  /* ----- 我的收藏 ----- */
  $('collBtn').addEventListener('click', function () {
    var list = pool().filter(function (c) { return G.favs.indexOf(c.id) >= 0; });
    var mineOnly = G.mine.filter(function (c) { return list.indexOf(c) < 0; });
    var html = '';
    function row(c, canDel) {
      return '<div class="item"><div class="e">' + esc(c.emoji || '🍀') + '</div><div class="t">' + esc(c.title ? c.title + '：' : '') +
        esc(c.text.length > 70 ? c.text.slice(0, 70) + '…' : c.text) + (c.date ? '<small>' + esc(c.date) + '</small>' : '') + '</div>' +
        (canDel ? '<button class="del" data-del="' + c.id + '">删除</button>' : '') + '</div>';
    }
    if (list.length) html += '<div class="lab">收藏的扭蛋</div>' + list.map(function (c) { return row(c, false); }).join('');
    if (G.mine.length) html += '<div class="lab">我放进去的</div>' + G.mine.map(function (c) { return row(c, true); }).join('');
    $('collList').innerHTML = html || '<div class="empty">还没有收藏，抽一颗试试吧</div>';
    openOv('ovColl');
  });
  $('collList').addEventListener('click', function (e) {
    var b = e.target.closest('[data-del]'); if (!b) return;
    var id = b.dataset.del;
    if (!confirm('删除这颗扭蛋？删除后找不回来')) return;
    store.del(id).then(function () {
      G.mine = G.mine.filter(function (c) { return c.id !== id; });
      G.favs = G.favs.filter(function (f) { return f !== id; }); localStorage.setItem('knull_favs', JSON.stringify(G.favs));
      refresh(); $('collBtn').click();
    });
  });

  /* 起始页：从信封开始；刷新时若停在 loading 则回信封 */
  var start = location.hash.replace('#', '');
  show(start && start !== 'loading' ? start : 'envelope');
  window.addEventListener('hashchange', function () {
    var n = location.hash.replace('#', ''); if (n) show(n);
  });
</script>
</body>
</html>
