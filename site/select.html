<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>生日贺卡 · 选面包</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Baloo 2', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  body {
    background-color: #F9F4D4;
    background-image: radial-gradient(circle, #AFD3E8 5px, transparent 5.5px);
    background-size: 96px 96px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage {
    width: 100%;
    max-width: 480px;
    height: 100%;
    max-height: 900px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .toast-wrap {
    position: relative;
    width: 100%;
    max-width: 420px;
  }
  .toast-img {
    width: 100%;
    display: block;
    user-select: none;
    pointer-events: none;
  }
  .spot {
    position: absolute;
    width: 24%;
    height: 22%;
    border-radius: 50%;
    background: none;
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transform: translate(-50%, -50%);
    transition: transform 0.15s ease;
  }
  .spot:active {
    transform: translate(-50%, -50%) scale(0.9);
  }
  .spot-1 { left: 34.7%; top: 32.3%; }
  .spot-2 { left: 63.8%; top: 31.8%; }
  .spot-3 { left: 34.3%; top: 62.5%; }
  .spot-4 { left: 63.4%; top: 66%; }

  .hint {
    margin-top: 22px;
    font-size: 13px;
    color: #B89A6A;
    opacity: 0;
    animation: fadeInHint 0.6s ease forwards;
    animation-delay: 0.8s;
  }
  @keyframes fadeInHint {
    to { opacity: 1; }
  }
  .stage.fading {
    animation: fadeOut 0.6s ease forwards;
  }
  @keyframes fadeOut {
    to { opacity: 0; transform: scale(0.98); }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="toast-wrap">
    <img class="toast-img" src="assets/select_breads.png" alt="选一个面包">
    <button class="spot spot-1" data-target="box1.html" aria-label="面包一"></button>
    <button class="spot spot-2" data-target="box2.html" aria-label="面包二"></button>
    <button class="spot spot-3" data-target="box3.html" aria-label="面包三"></button>
    <button class="spot spot-4" data-target="box4.html" aria-label="面包四"></button>
  </div>
  <div class="hint">选一个面包，拆开你的盲盒</div>
</div>

<script>
  var stage = document.getElementById('stage');
  var spots = document.querySelectorAll('.spot');

  spots.forEach(function (spot) {
    spot.addEventListener('click', function () {
      var target = spot.getAttribute('data-target');
      stage.classList.add('fading');
      setTimeout(function () {
        window.location.href = target;
      }, 550);
    });
  });
</script>

</body>
</html>
