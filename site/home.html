<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>生日贺卡 · 首页</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Baloo 2', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  body {
    background-color: #F9F4D4;
    background-image: radial-gradient(circle, #AFD3E8 5px, transparent 5.5px);
    background-size: 96px 96px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage {
    width: 100%;
    max-width: 480px;
    height: 100%;
    max-height: 900px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .house-btn {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .house-img {
    width: 100%;
    max-width: 420px;
    display: block;
    user-select: none;
    pointer-events: none;
    animation: breathe 1.8s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.035); }
  }
  .hint {
    margin-top: 26px;
    font-size: 13px;
    color: #B89A6A;
    opacity: 0;
    animation: fadeInHint 0.6s ease forwards;
    animation-delay: 1s;
  }
  @keyframes fadeInHint {
    to { opacity: 1; }
  }
  .stage.fading {
    animation: fadeOut 0.6s ease forwards;
  }
  @keyframes fadeOut {
    to { opacity: 0; transform: scale(0.98); }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <button class="house-btn" id="houseBtn" aria-label="点击进入面包店">
    <img class="house-img" src="assets/home_house.png" alt="面包屋生日贺卡首页">
  </button>
  <div class="hint">点一下面包屋，开始吧</div>
</div>

<script>
  var stage = document.getElementById('stage');
  var houseBtn = document.getElementById('houseBtn');

  houseBtn.addEventListener('click', function () {
    stage.classList.add('fading');
    setTimeout(function () {
      window.location.href = 'select.html';
    }, 550);
  });
</script>

</body>
</html>
